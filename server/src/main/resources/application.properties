server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
game.demo-seed.enabled=${GAME_DEMO_SEED_ENABLED:false}
game.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:*}
game.reconnect-grace-ms=30000
game.heartbeat-interval-ms=5000
game.heartbeat-timeout-ms=12000
game.scoring.minimum-exposure-ms=10000

# ==============================================================================
# Cấu hình Cơ sở dữ liệu mặc định: MySQL local (database scribble_game)
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/scribble_game?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Bộ đệm WebSocket truyền tải nét vẽ mượt mà không bị ngắt
server.servlet.context-parameters.org.apache.tomcat.websocket.textBufferSize=10485760
server.servlet.context-parameters.org.apache.tomcat.websocket.binaryBufferSize=10485760
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB
